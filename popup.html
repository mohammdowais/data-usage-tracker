<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 440px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 8px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #1a73e8;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      background: #f1f3f4;
      padding: 8px 4px;
      text-align: left;
      position: sticky;
      top: 0;
    }
    td {
      padding: 6px 4px;
      border-bottom: 1px solid #e8eaed;
    }
    .num {
      text-align: right;
      font-family: monospace;
    }
    .total-bar {
      margin-top: 12px;
      padding: 10px;
      background: #e8f0fe;
      border-radius: 6px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #d93025;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #b3261e;
    }
    .empty {
      text-align: center;
      color: #5f6368;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h2>Data Usage</h2>
  <div id="stats">
    <table>
      <thead>
        <tr>
          <th>Domain</th>
          <th class="num">Download</th>
          <th class="num">Upload</th>
          <th class="num">Total</th>
        </tr>
      </thead>
      <tbody id="usageBody"></tbody>
    </table>
    <div id="total" class="total-bar"></div>
  </div>
  <button id="resetBtn">Reset All Data</button>
  <script src="popup.js"></script>
</body>
</html>
